<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Easya Translator</title>

<style>

body {

  font-family:
    sans-serif;

  background:
    #111;

  color:
    white;

  margin:
    0;

  padding:
    30px;
}

.container {

  max-width:
    700px;

  margin:
    auto;
}

h1 {

  font-size:
    40px;

  margin-bottom:
    20px;
}

textarea {

  width:
    100%;

  height:
    140px;

  background:
    #1e1e1e;

  color:
    white;

  border:
    1px solid #444;

  border-radius:
    10px;

  padding:
    15px;

  font-size:
    18px;

  resize:
    vertical;

  box-sizing:
    border-box;
}

.controls {

  display:
    flex;

  align-items:
    center;

  gap:
    12px;

  margin-top:
    15px;
}

button {

  padding:
    12px 24px;

  font-size:
    18px;

  border:
    none;

  border-radius:
    10px;

  background:
    #4f46e5;

  color:
    white;

  cursor:
    pointer;
}

button:disabled {

  opacity:
    0.5;

  cursor:
    not-allowed;
}

#directionButton {

  background:
    #2d2d2d;

  border:
    1px solid #555;

  font-size:
    15px;

  padding:
    12px 18px;
}

#directionButton:hover:not(:disabled) {

  background:
    #3a3a3a;
}

.result {

  margin-top:
    25px;

  padding:
    20px;

  background:
    #1e1e1e;

  border-radius:
    10px;

  min-height:
    60px;

  font-size:
    22px;

  line-height:
    1.6;

  white-space:
    pre-wrap;
}

.status {

  margin-top:
    10px;

  color:
    #aaa;
}

</style>

</head>

<body>

<div class="container">

<h1>Easya Translator</h1>

<textarea
  id="input"
  placeholder="I speak Easya Language"
></textarea>

<div class="controls">

  <button
    id="translateButton"
    disabled
  >
  Translate
  </button>

  <button
    id="directionButton"
    disabled
  >
  EN → Easya
  </button>

</div>

<div
  class="status"
  id="status"
>
Loading dictionary...
</div>

<div
  class="result"
  id="result"
></div>

</div>

<script>

/*
  ============================================================
  State
  ============================================================
*/

let dictionary = {};

/*
  Reverse dictionary: Easya → English
*/

let reverseDictionary = {};

let exceptions = {};

/*
  "en2ea" or "ea2en"
*/

let direction = "en2ea";

/*
  ============================================================
  DOM
  ============================================================
*/

const translateButton =
  document.getElementById(
    "translateButton"
  );

const directionButton =
  document.getElementById(
    "directionButton"
  );

const statusText =
  document.getElementById(
    "status"
  );

const inputEl =
  document.getElementById(
    "input"
  );

/*
  ============================================================
  Initialization
  ============================================================
*/

initialize();

async function initialize() {

  try {

    await loadDictionary();

    await loadExceptions();

    statusText.innerText =
      "Dictionary loaded successfully";

    translateButton.disabled =
      false;

    directionButton.disabled =
      false;

  } catch (error) {

    console.error(error);

    statusText.innerText =
      "Failed to load";
  }
}

/*
  ============================================================
  Load Dictionary
  ============================================================
*/

async function loadDictionary() {

  const response =
    await fetch(
      "Easyaev.zpdc"
    );

  if (!response.ok) {

    throw new Error(
      "Failed to retrieve dictionary file"
    );
  }

  const data =
    await response.json();

  buildDictionary(data);

  console.log(
    "dictionary:",
    dictionary
  );

  console.log(
    "reverseDictionary:",
    reverseDictionary
  );
}

/*
  ============================================================
  Build Dictionary
  ============================================================
*/

function buildDictionary(data) {

  dictionary        = {};
  reverseDictionary = {};

  if (!data.words) {

    console.error(
      "words does not exist"
    );

    return;
  }

  for (
    const word
    of data.words
  ) {

    const easya =
      word.spelling;

    const equivalents =
      word.sections?.[0]
      ?.equivalents ?? [];

    for (
      const equivalent
      of equivalents
    ) {

      for (
        const term
        of (equivalent.terms ?? [])
      ) {

        if (!term) continue;

        /*
          EN → Easya
        */

        if (
          !dictionary[
            term.toLowerCase()
          ]
        ) {

          dictionary[
            term.toLowerCase()
          ] = easya;

          console.log(term, "→", easya);
        }

        /*
          Easya → EN
        */

        if (
          !reverseDictionary[
            easya.toLowerCase()
          ]
        ) {

          reverseDictionary[
            easya.toLowerCase()
          ] = term;

          console.log(easya, "→", term);
        }
      }
    }

    /*
      Variations (e.g. Possessive Adjective)
    */

    const variations =
      word.sections?.[0]
      ?.variations ?? [];

    for (
      const variation
      of variations
    ) {

      const varSpelling =
        variation.spelling;

      const varTitle =
        variation.title
        ?.toLowerCase() ?? "";

      for (
        const equivalent
        of equivalents
      ) {

        for (
          const term
          of (equivalent.terms ?? [])
        ) {

          const engVariant =
            toEnglishVariation(
              term,
              varTitle
            );

          if (engVariant && varSpelling) {

            if (
              !dictionary[
                engVariant.toLowerCase()
              ]
            ) {

              dictionary[
                engVariant.toLowerCase()
              ] = varSpelling;

              console.log(
                engVariant, "→", varSpelling
              );
            }

            if (
              !reverseDictionary[
                varSpelling.toLowerCase()
              ]
            ) {

              reverseDictionary[
                varSpelling.toLowerCase()
              ] = engVariant;

              console.log(
                varSpelling, "→", engVariant
              );
            }
          }
        }
      }
    }
  }
}

/*
  ============================================================
  English possessive forms
  ============================================================
*/

function toEnglishVariation(
  baseTerm,
  variationTitle
) {

  if (
    variationTitle.includes("possessive")
  ) {

    const map = {
      "i":        "my",
      "you":      "your",
      "he":       "his",
      "she":      "her",
      "it":       "its",
      "we":       "our",
      "they":     "their",
      "you guys": "your",
    };

    return map[baseTerm.toLowerCase()]
      ?? null;
  }

  return null;
}

/*
  ============================================================
  Load Exceptions
  ============================================================
*/

async function loadExceptions() {

  try {

    const response =
      await fetch(
        "Exceptions.txt"
      );

    if (!response.ok) {

      console.warn(
        "Exceptions.txt not found"
      );

      return;
    }

    const text =
      await response.text();

    parseExceptions(text);

    console.log(
      "exceptions:",
      exceptions
    );

  } catch (error) {

    console.error(
      "Failed to load exceptions:",
      error
    );
  }
}

/*
  ============================================================
  Parse Exceptions
  Format: verb|subject=easya
  e.g.  : am|i=este
  ============================================================
*/

function parseExceptions(text) {

  exceptions = {};

  const lines =
    text.split("\n");

  for (const line of lines) {

    const trimmed =
      line.trim();

    if (!trimmed)                 continue;
    if (trimmed.startsWith("#"))  continue;

    const parts =
      trimmed.split("=");

    if (parts.length !== 2)       continue;

    const key =
      parts[0].trim().toLowerCase();

    const value =
      parts[1].trim();

    exceptions[key] = value;

    console.log(key, "→", value);
  }
}

/*
  ============================================================
  Direction button
  ============================================================
*/

directionButton.addEventListener(
  "click",
  () => {

    direction =
      direction === "en2ea"
        ? "ea2en"
        : "en2ea";

    directionButton.textContent =
      direction === "en2ea"
        ? "EN → Easya"
        : "Easya → EN";

    inputEl.placeholder =
      direction === "en2ea"
        ? "I speak Easya Language"
        : "Mio speke Easyaev";

    document
      .getElementById("result")
      .innerText = "";
  }
);

/*
  ============================================================
  Translate button
  ============================================================
*/

translateButton.addEventListener(
  "click",
  translate
);

/*
  ============================================================
  Main translate
  Splits input into sentences, processes each
  ============================================================
*/

function translate() {

  const input =
    inputEl.value.trim();

  if (!input) return;

  const sentences =
    splitSentences(input);

  const resultLines =
    sentences.map(sentence =>

      direction === "en2ea"
        ? translateEnToEa(sentence)
        : translateEaToEn(sentence)
    );

  document
    .getElementById("result")
    .innerText =
      resultLines.join(" ");
}

/*
  ============================================================
  Split into sentences (keep terminal punctuation)
  ============================================================
*/

function splitSentences(text) {

  return text
    .split(/(?<=[.!?])\s+/)
    .map(s => s.trim())
    .filter(Boolean);
}

/*
  ============================================================
  EN → Easya

  Steps:
  1. Detect tense (will/shall → future, was/were/did → past)
     and strip those aux tokens.
  2. Strip "not"/"n't" → will insert as "non" before verb.
  3. Word-for-word translation.
  4. Insert "non" before first verb if negated.
  5. Apply tense suffix to first verb.
  6. If question (ends ?), reorder SVO → VSO.
  ============================================================
*/

function translateEnToEa(sentence) {

  const isQuestion =
    /\?$/.test(sentence.trim());

  const tokens =
    tokenize(sentence);

  const ENAuxPast =
    new Set(["was","were","did"]);

  const ENAuxFuture =
    new Set(["will","shall"]);

  const beVerbs =
    new Set(["am","is","are","was","were"]);

  const subjectPronouns =
    new Set([
      "i","you","he","she","it",
      "we","they","you guys",
    ]);

  let tense      = "present";
  let hasNot     = false;
  const skipIdx  = new Set();

  /*
    --- Pass 1: detect tense & negation ---
  */

  for (
    let i = 0;
    i < tokens.length;
    i++
  ) {

    const w =
      tokens[i].word.toLowerCase();

    if (ENAuxPast.has(w)) {

      tense = "past";
      skipIdx.add(i);

    } else if (ENAuxFuture.has(w)) {

      tense = "future";
      skipIdx.add(i);
    }

    if (w === "not" || w === "n't") {

      hasNot = true;
      skipIdx.add(i);
    }
  }

  /*
    --- Pass 2: word-for-word translation ---
  */

  let lastSubject = undefined;
  let verbIdx     = -1;

  const tagged = [];

  for (
    let i = 0;
    i < tokens.length;
    i++
  ) {

    if (skipIdx.has(i)) continue;

    const { word: original, punct } =
      tokens[i];

    const token =
      original.toLowerCase();

    if (subjectPronouns.has(token)) {
      lastSubject = token;
    }

    /*
      Exception lookup for be-verbs
    */

    const exceptionKey =
      token + "|" + lastSubject;

    let easya;

    if (
      beVerbs.has(token) &&
      exceptions[exceptionKey]
    ) {

      easya = exceptions[exceptionKey];

    } else {

      easya =
        dictionary[token] ?? original;
    }

    /*
      Role detection
    */

    let role = "other";

    if (subjectPronouns.has(token)) {

      role = "subject";

    } else if (
      beVerbs.has(token) ||
      (
        tagged.some(t => t.role === "subject") &&
        verbIdx === -1 &&
        (
          dictionary[token] !== undefined ||
          exceptions[exceptionKey] !== undefined
        )
      )
    ) {

      role = "verb";
    }

    if (role === "verb" && verbIdx === -1) {

      verbIdx = tagged.length;
    }

    tagged.push({ easya, punct, role });
  }

  /*
    --- Pass 3: insert "non" before verb ---
  */

  if (hasNot && verbIdx !== -1) {

    tagged.splice(
      verbIdx,
      0,
      { easya: "non", punct: "", role: "other" }
    );

    verbIdx += 1;
  }

  /*
    --- Pass 4: apply tense suffix ---
  */

  if (verbIdx !== -1) {

    const v = tagged[verbIdx];

    v.easya =
      applyTenseEasya(v.easya, tense);
  }

  /*
    --- Pass 5: reorder for question ---
  */

  const ordered =
    isQuestion
      ? reorderToVSO(tagged)
      : tagged;

  return ordered
    .map(t => t.easya + t.punct)
    .join(" ");
}

/*
  ============================================================
  Easya → EN

  Steps:
  1. Detect tense suffix on first verb (-ed past, -en future).
  2. Detect "non" → negation, strip it.
  3. Word-for-word translation (strip tense suffix for lookup).
  4. If question (ends ?), reorder VSO → SVO.
  5. Insert aux verb (was/will) before verb.
  6. Insert "not" after verb.
  ============================================================
*/

function translateEaToEn(sentence) {

  const isQuestion =
    /\?$/.test(sentence.trim());

  const tokens =
    tokenize(sentence);

  const easyaSubjects =
    new Set([
      "mio","tosso","ilo","eto",
      "mios","tossos","ilos","etos",
    ]);

  /*
    Be-verb base forms (present)
  */

  const easyaBeVerbBases =
    new Set(["este","iste"]);

  let tense          = "present";
  let hasNon         = false;
  const skipIdx      = new Set();
  const tenseTokens  = new Set();

  /*
    --- Pass 1: detect tense & negation ---
  */

  for (
    let i = 0;
    i < tokens.length;
    i++
  ) {

    const w =
      tokens[i].word.toLowerCase();

    if (w === "non") {

      hasNon = true;
      skipIdx.add(i);
      continue;
    }

    /*
      Check -ed suffix
    */

    if (
      tense === "present" &&
      w.endsWith("ed")
    ) {

      const base = w.slice(0, -1); // remove 'd'

      if (
        reverseDictionary[base] ||
        easyaBeVerbBases.has(base)
      ) {

        tense = "past";
        tenseTokens.add(i);
      }
    }

    /*
      Check -en suffix
    */

    if (
      tense === "present" &&
      w.endsWith("en")
    ) {

      const base = w.slice(0, -1); // remove 'n'

      if (
        reverseDictionary[base] ||
        easyaBeVerbBases.has(base)
      ) {

        tense = "future";
        tenseTokens.add(i);
      }
    }
  }

  /*
    --- Pass 2: word-for-word translation ---
  */

  let verbIdx = -1;

  const tagged = [];

  for (
    let i = 0;
    i < tokens.length;
    i++
  ) {

    if (skipIdx.has(i)) continue;

    const { word: original, punct } =
      tokens[i];

    let token =
      original.toLowerCase();

    /*
      Strip tense suffix for lookup
    */

    if (tenseTokens.has(i)) {

      if (tense === "past") {

        token = token.slice(0, -1);

      } else if (tense === "future") {

        token = token.slice(0, -1);
      }
    }

    const english =
      reverseDictionary[token]
      ?? original;

    let role = "other";

    if (easyaSubjects.has(token)) {

      role = "subject";

    } else if (
      easyaBeVerbBases.has(token) ||
      (
        tagged.some(t => t.role === "subject") &&
        verbIdx === -1 &&
        reverseDictionary[token] !== undefined
      )
    ) {

      role = "verb";
    }

    if (role === "verb" && verbIdx === -1) {

      verbIdx = tagged.length;
    }

    tagged.push({ english, punct, role });
  }

  /*
    --- Pass 3: reorder VSO → SVO ---
  */

  const ordered =
    isQuestion
      ? reorderToSVO(tagged)
      : tagged;

  /*
    --- Pass 4: insert aux verb ---
  */

  const finalVerbIdx =
    ordered.findIndex(
      t => t.role === "verb"
    );

  if (tense === "past" && finalVerbIdx !== -1) {

    ordered.splice(
      finalVerbIdx,
      0,
      { english: "was", punct: "", role: "aux" }
    );

  } else if (
    tense === "future" &&
    finalVerbIdx !== -1
  ) {

    ordered.splice(
      finalVerbIdx,
      0,
      { english: "will", punct: "", role: "aux" }
    );
  }

  /*
    --- Pass 5: insert "not" after verb ---
  */

  if (hasNon) {

    const vIdx =
      ordered.findIndex(
        t => t.role === "verb"
      );

    if (vIdx !== -1) {

      ordered.splice(
        vIdx + 1,
        0,
        { english: "not", punct: "", role: "other" }
      );
    }
  }

  return ordered
    .map(t => t.english + t.punct)
    .join(" ");
}

/*
  ============================================================
  Reorder: SVO → VSO
  Moves first verb token to front
  ============================================================
*/

function reorderToVSO(tagged) {

  const vIdx =
    tagged.findIndex(
      t => t.role === "verb"
    );

  if (vIdx <= 0) return tagged;

  const result = [...tagged];

  const [verb] =
    result.splice(vIdx, 1);

  result.unshift(verb);

  return result;
}

/*
  ============================================================
  Reorder: VSO → SVO
  If verb comes before subject, move subject to front
  ============================================================
*/

function reorderToSVO(tagged) {

  const vIdx =
    tagged.findIndex(
      t => t.role === "verb"
    );

  const sIdx =
    tagged.findIndex(
      t => t.role === "subject"
    );

  if (vIdx === -1 || sIdx === -1) {
    return tagged;
  }

  if (vIdx < sIdx) {

    const result = [...tagged];

    const [subject] =
      result.splice(sIdx, 1);

    result.unshift(subject);

    return result;
  }

  return tagged;
}

/*
  ============================================================
  Apply Easya tense suffix
  Verb ends in -e → -ed (past) or -en (future)
  ============================================================
*/

function applyTenseEasya(verb, tense) {

  if (!verb) return verb;

  if (verb.endsWith("e")) {

    if (tense === "past")   return verb + "d";
    if (tense === "future") return verb + "n";
  }

  return verb;
}

/*
  ============================================================
  Tokenize
  Returns: Array of { word: string, punct: string }
  ============================================================
*/

function tokenize(text) {

  const pattern =
    /([\p{L}\p{N}']+)([^\p{L}\p{N}'\s]*)/gu;

  const tokens = [];

  let match;

  while (
    (match = pattern.exec(text)) !== null
  ) {

    tokens.push({
      word:  match[1],
      punct: match[2],
    });
  }

  return tokens;
}

</script>

</body>
</html>
