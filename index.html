<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Easya Translator</title>

<style>

body {

  font-family:
    sans-serif;

  background:
    #111;

  color:
    white;

  margin:
    0;

  padding:
    30px;
}

.container {

  max-width:
    700px;

  margin:
    auto;
}

h1 {

  font-size:
    40px;

  margin-bottom:
    20px;
}

textarea {

  width:
    100%;

  height:
    140px;

  background:
    #1e1e1e;

  color:
    white;

  border:
    1px solid #444;

  border-radius:
    10px;

  padding:
    15px;

  font-size:
    18px;

  resize:
    vertical;

  box-sizing:
    border-box;
}

button {

  margin-top:
    15px;

  padding:
    12px 24px;

  font-size:
    18px;

  border:
    none;

  border-radius:
    10px;

  background:
    #4f46e5;

  color:
    white;

  cursor:
    pointer;
}

button:disabled {

  opacity:
    0.5;

  cursor:
    not-allowed;
}

.result {

  margin-top:
    25px;

  padding:
    20px;

  background:
    #1e1e1e;

  border-radius:
    10px;

  min-height:
    60px;

  font-size:
    22px;

  line-height:
    1.6;

  white-space:
    pre-wrap;
}

.status {

  margin-top:
    10px;

  color:
    #aaa;
}

</style>

</head>

<body>

<div class="container">

<h1>Easya Translator</h1>

<textarea
  id="input"
  placeholder="I speak Easya Language"
></textarea>

<button
  id="translateButton"
  disabled
>
Translate
</button>

<div
  class="status"
  id="status"
>
Loading dictionary...
</div>

<div
  class="result"
  id="result"
></div>

</div>

<script>

let dictionary = {};

let exceptions = {};

const button =
  document.getElementById(
    "translateButton"
  );

const statusText =
  document.getElementById(
    "status"
  );

/*
  Initialization
*/

initialize();

async function initialize() {

  try {

    await loadDictionary();

    await loadExceptions();

    statusText.innerText =
      "Dictionary loaded successfully";

    button.disabled =
      false;

  } catch (error) {

    console.error(error);

    statusText.innerText =
      "Failed to load";
  }
}

/*
  Load Dictionary
*/

async function loadDictionary() {

  const response =
    await fetch(
      "Easyaev.zpdc"
    );

  if (!response.ok) {

    throw new Error(
      "Failed to retrieve dictionary file"
    );
  }

  const data =
    await response.json();

  buildDictionary(data);

  console.log(
    "dictionary:",
    dictionary
  );
}

/*
  Build Dictionary
*/

function buildDictionary(data) {

  dictionary = {};

  if (!data.words) {

    console.error(
      "words does not exist"
    );

    return;
  }

  for (
    const word
    of data.words
  ) {

    /*
      Easya language
    */

    const easya =
      word.spelling;

    /*
      English translation
    */

    const english =
      word.sections?.[0]
      ?.equivalents?.[0]
      ?.terms?.[0];

    if (
      easya &&
      english
    ) {

      /*
        English
        ↓
        Easya
      */

      dictionary[
        english.toLowerCase()
      ] = easya;

      console.log(
        english,
        "→",
        easya
      );
    }
  }
}

/*
  Load Exceptions
*/

async function loadExceptions() {

  try {

    const response =
      await fetch(
        "Exceptions.txt"
      );

    if (!response.ok) {

      console.warn(
        "Exceptions.txt not found"
      );

      return;
    }

    const text =
      await response.text();

    parseExceptions(text);

    console.log(
      "exceptions:",
      exceptions
    );

  } catch (error) {

    console.error(
      "Failed to load exceptions:",
      error
    );
  }
}

/*
  Parse Exceptions
*/

function parseExceptions(text) {

  exceptions = {};

  const lines =
    text.split("\n");

  for (const line of lines) {

    const trimmed =
      line.trim();

    /*
      Empty line
    */

    if (!trimmed) {
      continue;
    }

    /*
      Comment
    */

    if (
      trimmed.startsWith("#")
    ) {
      continue;
    }

    /*
      am|i=este
    */

    const parts =
      trimmed.split("=");

    if (
      parts.length !== 2
    ) {
      continue;
    }

    const key =
      parts[0]
      .trim()
      .toLowerCase();

    const value =
      parts[1]
      .trim();

    exceptions[key] =
      value;

    console.log(
      key,
      "→",
      value
    );
  }
}

/*
  Button Event
*/

button.addEventListener(
  "click",
  translate
);

/*
  Translate
*/

function translate() {

  const input =
    document.getElementById(
      "input"
    ).value;

  const result =
    document.getElementById(
      "result"
    );

  /*
    Original tokens
  */

  const originalTokens =
    tokenize(input);

  console.log(
    "tokens:",
    originalTokens
  );

  /*
    Output
  */

  const translated = [];

  for (
    let i = 0;
    i < originalTokens.length;
    i++
  ) {

    /*
      Original word
    */

    const original =
      originalTokens[i];

    /*
      Convert to lowercase
    */

    const token =
      original.toLowerCase();

    /*
      Previous word
    */

    const previous =
      originalTokens[
        i - 1
      ]?.toLowerCase();

    /*
      Exception key
    */

    const exceptionKey =
      token +
      "|" +
      previous;

    /*
      Exception priority
    */

    if (
      exceptions[
        exceptionKey
      ]
    ) {

      translated.push(
        exceptions[
          exceptionKey
        ]
      );

      console.log(
        "Exception:",
        exceptionKey,
        "→",
        exceptions[
          exceptionKey
        ]
      );

      continue;
    }

    /*
      Standard dictionary
    */

    if (
      dictionary[token]
    ) {

      translated.push(
        dictionary[token]
      );

      console.log(
        "Dictionary:",
        token,
        "→",
        dictionary[token]
      );

    } else {

      /*
        Keep unknown word
      */

      translated.push(
        original
      );

      console.log(
        "Unknown word:",
        original
      );
    }
  }

  /*
    Display result
  */

  result.innerText =
    translated.join(" ");
}

/*
  Tokenize
*/

function tokenize(text) {

  return text

    .replace(
      /[^\p{L}\p{N}\s']/gu,
      ""
    )

    .split(/\s+/)

    .filter(Boolean);
}

</script>

</body>
</html>
