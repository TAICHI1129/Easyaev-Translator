<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Easya Translator</title>

<style>

body {

  font-family:
    sans-serif;

  background:
    #111;

  color:
    white;

  margin:
    0;

  padding:
    30px;
}

.container {

  max-width:
    700px;

  margin:
    auto;
}

h1 {

  font-size:
    40px;

  margin-bottom:
    20px;
}

textarea {

  width:
    100%;

  height:
    140px;

  background:
    #1e1e1e;

  color:
    white;

  border:
    1px solid #444;

  border-radius:
    10px;

  padding:
    15px;

  font-size:
    18px;

  resize:
    vertical;

  box-sizing:
    border-box;
}

button {

  margin-top:
    15px;

  padding:
    12px 24px;

  font-size:
    18px;

  border:
    none;

  border-radius:
    10px;

  background:
    #4f46e5;

  color:
    white;

  cursor:
    pointer;
}

button:disabled {

  opacity:
    0.5;

  cursor:
    not-allowed;
}

.result {

  margin-top:
    25px;

  padding:
    20px;

  background:
    #1e1e1e;

  border-radius:
    10px;

  min-height:
    60px;

  font-size:
    22px;

  line-height:
    1.6;
}

.status {

  margin-top:
    10px;

  color:
    #aaa;
}

</style>
</head>
<body>

<div class="container">

<h1>Easya Translator</h1>

<textarea
  id="input"
  placeholder="I speak Language"
></textarea>

<button
  id="translateButton"
  disabled
>
Translate
</button>

<div
  class="status"
  id="status"
>
辞書読み込み中...
</div>

<div
  class="result"
  id="result"
></div>

</div>

<script>

let dictionary = {};

const button =
  document.getElementById(
    "translateButton"
  );

const statusText =
  document.getElementById(
    "status"
  );

loadDictionary();

async function loadDictionary() {

  try {

    const response =
      await fetch(
        "Easyaev.zpdc"
      );

    if (!response.ok) {

      throw new Error(
        "辞書ファイル取得失敗"
      );
    }

    const data =
      await response.json();

    buildDictionary(data);

    console.log(
      "完成辞書:",
      dictionary
    );

    statusText.innerText =
      "辞書読み込み完了";

    button.disabled =
      false;

  } catch (error) {

    console.error(error);

    statusText.innerText =
      "辞書読み込み失敗";
  }
}

function buildDictionary(data) {

  dictionary = {};

  if (!data.words) {

    console.error(
      "words が存在しません"
    );

    return;
  }

  for (
    const word
    of data.words
  ) {

    /*
      エアーシャ語
    */

    const easya =
      word.spelling;

    /*
      英語訳
    */

    const english =
      word.sections?.[0]
      ?.equivalents?.[0]
      ?.terms?.[0];

    if (
      easya &&
      english
    ) {

      /*
        英語
        ↓
        エアーシャ語
      */

      dictionary[
        english.toLowerCase()
      ] = easya;

      console.log(
        english,
        "→",
        easya
      );
    }
  }
}

button.addEventListener(
  "click",
  translate
);

function translate() {

  const input =
    document.getElementById(
      "input"
    ).value;

  const result =
    document.getElementById(
      "result"
    );

  const tokens =
    tokenize(input);

  console.log(
    "tokens:",
    tokens
  );

  const translated = [];

  for (const token of tokens) {

    if (
      dictionary[token]
    ) {

      translated.push(
        dictionary[token]
      );

    } else {

      /*
        未知語はそのまま
      */

      translated.push(
        token
      );
    }
  }

  result.innerText =
    translated.join(" ");
}

function tokenize(text) {

  return text

    .toLowerCase()

    .replace(
      /[^\p{L}\p{N}\s']/gu,
      ""
    )

    .split(/\s+/)

    .filter(Boolean);
}

</script>

</body>
</html>
