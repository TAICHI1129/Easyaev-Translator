<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Easya Translator</title>

<style>

body {

  font-family:
    sans-serif;

  background:
    #111;

  color:
    white;

  margin:
    0;

  padding:
    30px;
}

.container {

  max-width:
    700px;

  margin:
    auto;
}

h1 {

  font-size:
    40px;

  margin-bottom:
    20px;
}

textarea {

  width:
    100%;

  height:
    140px;

  background:
    #1e1e1e;

  color:
    white;

  border:
    1px solid #444;

  border-radius:
    10px;

  padding:
    15px;

  font-size:
    18px;

  resize:
    vertical;

  box-sizing:
    border-box;
}

button {

  margin-top:
    15px;

  padding:
    12px 24px;

  font-size:
    18px;

  border:
    none;

  border-radius:
    10px;

  background:
    #4f46e5;

  color:
    white;

  cursor:
    pointer;
}

button:disabled {

  opacity:
    0.5;

  cursor:
    not-allowed;
}

.result {

  margin-top:
    25px;

  padding:
    20px;

  background:
    #1e1e1e;

  border-radius:
    10px;

  min-height:
    60px;

  font-size:
    22px;

  line-height:
    1.6;

  white-space:
    pre-wrap;
}

.status {

  margin-top:
    10px;

  color:
    #aaa;
}

</style>

</head>

<body>

<div class="container">

<h1>Easya Translator</h1>

<textarea
  id="input"
  placeholder="I speak Easya Language"
></textarea>

<button
  id="translateButton"
  disabled
>
Translate
</button>

<div
  class="status"
  id="status"
>
Loading dictionary...
</div>

<div
  class="result"
  id="result"
></div>

</div>

<script>

let dictionary = {};

let exceptions = {};

const button =
  document.getElementById(
    "translateButton"
  );

const statusText =
  document.getElementById(
    "status"
  );

/*
  Initialization
*/

initialize();

async function initialize() {

  try {

    await loadDictionary();

    await loadExceptions();

    statusText.innerText =
      "Dictionary loaded successfully";

    button.disabled =
      false;

  } catch (error) {

    console.error(error);

    statusText.innerText =
      "Failed to load";
  }
}

/*
  Load Dictionary
*/

async function loadDictionary() {

  const response =
    await fetch(
      "Easyaev.zpdc"
    );

  if (!response.ok) {

    throw new Error(
      "Failed to retrieve dictionary file"
    );
  }

  const data =
    await response.json();

  buildDictionary(data);

  console.log(
    "dictionary:",
    dictionary
  );
}

/*
  Build Dictionary
*/

function buildDictionary(data) {

  dictionary = {};

  if (!data.words) {

    console.error(
      "words does not exist"
    );

    return;
  }

  for (
    const word
    of data.words
  ) {

    /*
      Easya language
    */

    const easya =
      word.spelling;

    /*
      English translation
    */

    const english =
      word.sections?.[0]
      ?.equivalents?.[0]
      ?.terms?.[0];

    if (
      easya &&
      english
    ) {

      /*
        English
        ↓
        Easya
      */

      dictionary[
        english.toLowerCase()
      ] = easya;

      console.log(
        english,
        "→",
        easya
      );
    }

    /*
      Variations (e.g. Possessive Adjective)
    */

    const variations =
      word.sections?.[0]
      ?.variations;

    if (
      variations &&
      variations.length > 0
    ) {

      const equivalents =
        word.sections?.[0]
        ?.equivalents ?? [];

      for (
        const variation
        of variations
      ) {

        const variationSpelling =
          variation.spelling;

        const varTitle =
          variation.title
          ?.toLowerCase() ?? "";

        for (
          const equivalent
          of equivalents
        ) {

          for (
            const term
            of (equivalent.terms ?? [])
          ) {

            const englishVariant =
              toEnglishVariation(
                term,
                varTitle
              );

            if (
              englishVariant &&
              variationSpelling
            ) {

              dictionary[
                englishVariant.toLowerCase()
              ] = variationSpelling;

              console.log(
                englishVariant,
                "→",
                variationSpelling
              );
            }
          }
        }
      }
    }
  }
}

/*
  Convert base pronoun + variation title
  to the corresponding English form
*/

function toEnglishVariation(
  baseTerm,
  variationTitle
) {

  if (
    variationTitle.includes(
      "possessive"
    )
  ) {

    const map = {
      "i":        "my",
      "you":      "your",
      "he":       "his",
      "she":      "her",
      "it":       "its",
      "we":       "our",
      "they":     "their",
      "you guys": "your",
    };

    return map[
      baseTerm.toLowerCase()
    ] ?? null;
  }

  return null;
}

/*
  Load Exceptions
*/

async function loadExceptions() {

  try {

    const response =
      await fetch(
        "Exceptions.txt"
      );

    if (!response.ok) {

      console.warn(
        "Exceptions.txt not found"
      );

      return;
    }

    const text =
      await response.text();

    parseExceptions(text);

    console.log(
      "exceptions:",
      exceptions
    );

  } catch (error) {

    console.error(
      "Failed to load exceptions:",
      error
    );
  }
}

/*
  Parse Exceptions
*/

function parseExceptions(text) {

  exceptions = {};

  const lines =
    text.split("\n");

  for (const line of lines) {

    const trimmed =
      line.trim();

    /*
      Empty line
    */

    if (!trimmed) {
      continue;
    }

    /*
      Comment
    */

    if (
      trimmed.startsWith("#")
    ) {
      continue;
    }

    /*
      am|i=este
    */

    const parts =
      trimmed.split("=");

    if (
      parts.length !== 2
    ) {
      continue;
    }

    const key =
      parts[0]
      .trim()
      .toLowerCase();

    const value =
      parts[1]
      .trim();

    exceptions[key] =
      value;

    console.log(
      key,
      "→",
      value
    );
  }
}

/*
  Button Event
*/

button.addEventListener(
  "click",
  translate
);

/*
  Translate
*/

function translate() {

  const input =
    document.getElementById(
      "input"
    ).value;

  const result =
    document.getElementById(
      "result"
    );

  /*
    Tokenize with punctuation info
    e.g. "Hello, world!" →
    [
      { word: "Hello", punct: "," },
      { word: "world", punct: "!" }
    ]
  */

  const tokens =
    tokenize(input);

  console.log(
    "tokens:",
    tokens
  );

  /*
    Subject pronouns used for
    Exception lookup (動詞|主語)
  */

  const subjectPronouns = new Set([
    "i", "you", "he", "she",
    "it", "we", "they", "you guys",
  ]);

  /*
    Output
  */

  const translated = [];

  /*
    Track the last subject pronoun
    seen so far in the sentence
  */

  let lastSubject = undefined;

  for (
    let i = 0;
    i < tokens.length;
    i++
  ) {

    const { word: original, punct } =
      tokens[i];

    /*
      Convert to lowercase
    */

    const token =
      original.toLowerCase();

    /*
      Update last subject
      when we see a subject pronoun
    */

    if (subjectPronouns.has(token)) {
      lastSubject = token;
    }

    /*
      Exception key: 動詞|主語
      e.g. "am|i", "is|he"
    */

    const exceptionKey =
      token +
      "|" +
      lastSubject;

    /*
      Exception priority
    */

    if (
      exceptions[exceptionKey]
    ) {

      translated.push(
        exceptions[exceptionKey] + punct
      );

      console.log(
        "Exception:",
        exceptionKey,
        "→",
        exceptions[exceptionKey]
      );

      continue;
    }

    /*
      Standard dictionary
    */

    if (dictionary[token]) {

      translated.push(
        dictionary[token] + punct
      );

      console.log(
        "Dictionary:",
        token,
        "→",
        dictionary[token]
      );

    } else {

      /*
        Keep unknown word
      */

      translated.push(
        original + punct
      );

      console.log(
        "Unknown word:",
        original
      );
    }
  }

  /*
    Display result
  */

  result.innerText =
    translated.join(" ");
}

/*
  Tokenize
  Returns: Array of { word: string, punct: string }
  Punctuation attached to a word is preserved
  and re-attached after translation.
*/

function tokenize(text) {

  /*
    Match a word (letters/numbers/apostrophe)
    optionally followed by punctuation
  */

  const pattern =
    /([\p{L}\p{N}']+)([^\p{L}\p{N}'\s]*)/gu;

  const tokens = [];

  let match;

  while (
    (match = pattern.exec(text)) !== null
  ) {

    tokens.push({
      word:  match[1],
      punct: match[2],
    });
  }

  return tokens;
}

</script>

</body>
</html>
